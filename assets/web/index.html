<!doctype html>
<html lang="__LANG__"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#146C63"><meta name="apple-mobile-web-app-capable" content="yes"><title>__APP_NAME__</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/icon-192.png"><link rel="stylesheet" href="vendor/leaflet.css"><link rel="stylesheet" href="style.css"><script defer src="vendor/leaflet.js"></script><script defer src="vendor/pdf.min.js"></script><script defer src="app.js"></script></head>
<body><header class="topbar"><a id="brand" href="#home">TripPocket</a><span id="connection"></span><button id="toolsButton" aria-label="Tools">☰</button></header><main id="home"><section id="hero" class="hero"><div class="hero-text"><span class="eyebrow" id="eyebrow"></span><h1 id="appName"></h1><p id="subtitle"></p></div></section><nav id="days" aria-label="Days"></nav><section id="dayHeading"></section><section id="banner"></section><section id="dayNotices"></section><section id="mapSection"><div id="map"></div><p id="mapCaption"></p></section><section id="timeline"></section><footer><button id="creditsButton"></button><p id="offlineNote"></p></footer></main>
