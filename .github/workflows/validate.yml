name: Validate Skill

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate fictional example
        run: python scripts/validate_trip.py examples/fictional-trip/trip.json --assets-root examples/fictional-trip
      - name: Run generator self-tests
        run: python scripts/self_test.py
      - name: Scan the public repository
        run: python scripts/public_release_check.py .
      - name: Check browser JavaScript syntax
        run: node --check assets/web/app.js && node --check assets/web/sw.js && node --check scripts/browser_test.cjs
